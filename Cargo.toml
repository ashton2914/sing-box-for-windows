[package]
name = "sing-box-launcher"
version = "0.1.0"
edition = "2021"
description = "Lightweight sing-box launcher for Windows"
build = "build.rs"
autobins = false

[[bin]]
name = "sing-box"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
anyhow = "1"
chrono = "0.4"
rfd = { version = "0.14", default-features = false }

[build-dependencies]
resvg = "0.44"
tiny-skia = "0.11"
usvg = "0.44"
ico = "0.4"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
